spring.application.name=bms
server.port=8080

# ===================== DATABASE CONNECTION =====================
# MOI THANH VIEN: doi 3 gia tri duoi day cho dung may cua minh truoc khi chay
#   1) Server name : thay HOANGQUACH (ten may) va Quack (ten instance)
#                    - instance mac dinh (MSSQLSERVER): bo phan ;instanceName=...
#   2) Username    : spring.datasource.username
#   3) Password    : spring.datasource.password
# Dung commit thay doi cua rieng may minh len GitHub.
spring.datasource.url=jdbc:sqlserver://HOANGQUACH;instanceName=Quack;databaseName=BMS;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
# ===============================================================
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Schema is managed by BMS_database.sql, not Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
