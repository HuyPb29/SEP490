spring.application.name=bms
server.port=8080

# Database (override via environment variables, see backend/.env.example)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=bms_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Schema is managed by BMSquery.sql, not Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
